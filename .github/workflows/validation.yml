name: validation

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: validation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validation:
        name: compile, lint, format, unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7

            - name: use node from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: validate
              run: npm run validation:check

            - name: verify the Playwright project graph resolves
              run: npx playwright test --list
